
name: Inspect cPanel Deployment Folders

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect cPanel folders through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          timeout: 30s
          command_timeout: 60s
          script: |
            set -e

            echo "===== CHECK REPOSITORY ====="
            REPO="/home/fbretcba/repositories/ministry-report_system"

            if [ -d "$REPO" ]; then
              cd "$REPO"
              pwd
              git status --short --branch
              git log -1 --oneline
            else
              echo "Repository folder not found"
            fi

            echo "===== CHECK PRODUCTION FOLDERS ====="

            for dir in \
              /home/fbretcba/report \
              /home/fbretcba/report/public \
              /home/fbretcba/report/uploads \
              /home/fbretcba/report/tmp \
              /home/fbretcba/report/tmp/restart.txt \
              /home/fbretcba/nodevenv/report/20
            do
              if [ -e "$dir" ]; then
                echo "FOUND: $dir"
                ls -ld "$dir"
              else
                echo "NOT FOUND: $dir"
              fi
            done

            echo "===== CHECK NODE ENVIRONMENT ====="

            NODE_DIR="/home/fbretcba/nodevenv/report/20/bin"

            if [ -x "$NODE_DIR/node" ]; then
              echo "Node.js version:"
              "$NODE_DIR/node" --version
            else
              echo "Node.js executable not found at $NODE_DIR/node"
            fi

            if [ -x "$NODE_DIR/npm" ]; then
              echo "NPM version:"
              "$NODE_DIR/npm" --version
            else
              echo "NPM executable not found at $NODE_DIR/npm"
            fi

            echo "===== INSPECTION COMPLETE ====="
