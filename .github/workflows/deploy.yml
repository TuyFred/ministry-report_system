
name: Ministry Reporting System - Build and cPanel Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ministry-report-production
  cancel-in-progress: false

jobs:
  build:
    name: Build React and prepare release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project structure
        run: |
          set -e

          echo "Checking project folders..."
          ls -la

          test -f client/package.json
          test -f server/package.json
          test -f server/index.js

          echo "Frontend and backend folders verified."

      - name: Install frontend dependencies
        working-directory: client
        run: |
          set -e

          if [ -f package-lock.json ]; then
            echo "Using package-lock.json"
            npm ci --include=dev --no-audit --no-fund
          else
            echo "No package-lock.json found."
            echo "Installing using package.json."
            npm install --include=dev --no-audit --no-fund
          fi

      - name: Build React frontend
        working-directory: client
        run: |
          set -e

          npm run build

          if [ ! -f dist/index.html ]; then
            echo "ERROR: React build did not generate dist/index.html"
            exit 1
          fi

          if [ -f .htaccess ]; then
            cp .htaccess dist/.htaccess
          fi

          echo "React build successful."

      - name: Prepare production release
        run: |
          set -e

          RELEASE="$RUNNER_TEMP/release"

          mkdir -p "$RELEASE/server"
          mkdir -p "$RELEASE/public"

          # Exclude secrets, uploads and server dependencies.
          tar -czf - \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./uploads' \
            --exclude='./node_modules' \
            --exclude='./tmp' \
            --exclude='./.git' \
            --exclude='./.htaccess' \
            -C server . | tar -xzf - -C "$RELEASE/server"

          # Copy the React production build.
          cp -a client/dist/. "$RELEASE/public/"

          # Verify release contents.
          test -f "$RELEASE/server/index.js"
          test -f "$RELEASE/server/package.json"
          test -f "$RELEASE/public/index.html"

          echo "Production release prepared."

      - name: Publish release to production-build branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          cd "$RUNNER_TEMP/release"

          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Production deployment package"
          git branch -M production-build

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin production-build

          echo "Production package published."

  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy application through SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          timeout: 120s
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            APP="/home/fbretcba/report"
            NODE="/home/fbretcba/nodevenv/report/20/bin"

            STAMP=$(date +%Y%m%d-%H%M%S)

            BACKUP="/home/fbretcba/deployment-backups/$STAMP"
            STAGING="/home/fbretcba/deployment-staging-$STAMP"
            ARCHIVE="/home/fbretcba/deployment-source-$STAMP.tar.gz"

            BACKEND_PUBLISHED=0
            PUBLIC_SWAPPED=0

            rollback() {
              STATUS=$?
              set +e

              echo "================================"
              echo "DEPLOYMENT FAILED"
              echo "STARTING ROLLBACK"
              echo "================================"

              if [ "$BACKEND_PUBLISHED" = "1" ] &&
                 [ -s "$BACKUP/application-source.tar.gz" ]; then

                echo "Restoring previous backend files..."

                tar -xzf "$BACKUP/application-source.tar.gz" -C "$APP"

                echo "Restoring previous backend dependencies..."

                cd "$APP"
                "$NODE/npm" install \
                  --omit=dev \
                  --no-audit \
                  --no-fund
              fi

              if [ "$PUBLIC_SWAPPED" = "1" ] &&
                 [ -d "$STAGING/previous-public" ]; then

                echo "Restoring previous frontend..."

                rm -rf "$APP/public"
                mv "$STAGING/previous-public" "$APP/public"
              fi

              if [ -f "$APP/tmp/restart.txt" ]; then
                touch "$APP/tmp/restart.txt"
              fi

              echo "Backup: $BACKUP"
              echo "Rollback attempt completed."
              exit "$STATUS"
            }

            trap rollback ERR

            echo "======================================"
            echo "MINISTRY REPORTING SYSTEM DEPLOYMENT"
            echo "======================================"

            # STEP 1: Check cPanel environment.

            echo "[1/8] Checking cPanel environment..."

            test -x "$NODE/node"
            test -x "$NODE/npm"

            "$NODE/node" --version
            "$NODE/npm" --version

            test -d "$APP"
            test -f "$APP/.env"
            test -d "$APP/uploads"
            test -d "$APP/tmp"
            test -d "$APP/node_modules"
            test -L "$APP/node_modules"

            command -v curl
            command -v tar

            echo "Environment checks passed."

            # STEP 2: Back up existing backend and frontend.

            echo "[2/8] Creating application backup..."

            mkdir -p "$BACKUP"
            mkdir -p "$STAGING"

            tar -czf "$BACKUP/application-source.tar.gz" \
              --exclude='./.env' \
              --exclude='./.env.*' \
              --exclude='./uploads' \
              --exclude='./node_modules' \
              --exclude='./public' \
              --exclude='./tmp' \
              --exclude='./.git' \
              --exclude='./.htaccess' \
              --exclude='./pre-deployment-backup' \
              -C "$APP" .

            if [ -d "$APP/public" ]; then
              tar -czf "$BACKUP/public-files.tar.gz" \
                -C "$APP" public
            fi

            echo "Backup created: $BACKUP"

            # STEP 3: Download the GitHub release.

            echo "[3/8] Downloading production release..."

            curl -fL \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 300 \
              "https://codeload.github.com/TuyFred/ministry-report_system/tar.gz/refs/heads/production-build" \
              -o "$ARCHIVE"

            test -s "$ARCHIVE"

            mkdir -p "$STAGING/source"

            tar -xzf "$ARCHIVE" \
              --strip-components=1 \
              -C "$STAGING/source"

            REPO="$STAGING/source"

            test -f "$REPO/server/index.js"
            test -f "$REPO/server/package.json"
            test -f "$REPO/public/index.html"

            echo "Release downloaded and verified."

            # STEP 4: Prepare deployment files.

            echo "[4/8] Preparing deployment files..."

            mkdir -p "$STAGING/new-public"

            cp -a "$REPO/public/." "$STAGING/new-public/"

            # Preserve existing public .htaccess if needed.

            if [ -f "$APP/public/.htaccess" ] &&
               [ ! -f "$STAGING/new-public/.htaccess" ]; then

              cp "$APP/public/.htaccess" \
                "$STAGING/new-public/.htaccess"
            fi

            tar -czf "$STAGING/backend.tar.gz" \
              --exclude='./.env' \
              --exclude='./.env.*' \
              --exclude='./uploads' \
              --exclude='./node_modules' \
              --exclude='./tmp' \
              --exclude='./.git' \
              --exclude='./.htaccess' \
              -C "$REPO/server" .

            test -s "$STAGING/backend.tar.gz"
            test -f "$STAGING/new-public/index.html"

            echo "Deployment files prepared."

            # STEP 5: Publish backend.

            echo "[5/8] Publishing backend..."

            BACKEND_PUBLISHED=1

            tar -xzf "$STAGING/backend.tar.gz" -C "$APP"

            # Keep the cPanel node_modules symlink.

            test -L "$APP/node_modules"

            cd "$APP"

            "$NODE/npm" install \
              --omit=dev \
              --no-audit \
              --no-fund

            test -d "$APP/node_modules"

            "$NODE/node" -e \
              "require('express'); require('sequelize'); console.log('Backend dependencies verified')"

            echo "Backend published."

            # STEP 6: Publish frontend safely.

            echo "[6/8] Publishing frontend..."

            if [ -d "$APP/public" ]; then
              mv "$APP/public" "$STAGING/previous-public"
            fi

            PUBLIC_SWAPPED=1

            mv "$STAGING/new-public" "$APP/public"

            test -f "$APP/public/index.html"

            echo "Frontend published."

            # STEP 7: Verify production files.

            echo "[7/8] Verifying production application..."

            test -f "$APP/index.js"
            test -f "$APP/package.json"
            test -f "$APP/public/index.html"

            test -f "$APP/.env"
            test -d "$APP/uploads"
            test -d "$APP/tmp"

            test -L "$APP/node_modules"

            echo "Production verification passed."

            # STEP 8: Restart Passenger.

            echo "[8/8] Restarting cPanel application..."

            touch "$APP/tmp/restart.txt"

            echo "Passenger restart requested."

            # Cleanup after successful deployment.

            rm -rf "$STAGING"
            rm -f "$ARCHIVE"

            trap - ERR

            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"
            echo "Website: https://report.gnitafrica.com"
            echo "Backup: $BACKUP"
            echo "======================================"
