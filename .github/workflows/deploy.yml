
name: Ministry Reporting System - GitHub Build and cPanel Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # JOB 1: BUILD REACT ON GITHUB
  build:
    name: Build Frontend on GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: client
        run: |
          echo "Installing React dependencies..."
          npm install --include=dev --no-audit --no-fund

      - name: Verify Vite installation
        working-directory: client
        run: |
          npm ls vite
          test -f node_modules/vite/bin/vite.js
          npx vite --version

      - name: Build React application
        working-directory: client
        run: |
          npm run build
          test -f dist/index.html
          echo "FRONTEND BUILD SUCCESSFUL"

      - name: Prepare production package
        run: |
          set -e

          RELEASE="$RUNNER_TEMP/release"

          mkdir -p "$RELEASE/server"
          mkdir -p "$RELEASE/public"

          echo "Copying backend source..."

          tar -czf - \
            --exclude='./.env*' \
            --exclude='./uploads' \
            --exclude='./node_modules' \
            --exclude='./tmp' \
            --exclude='./.git' \
            --exclude='./pre-deployment-backup' \
            -C server . | tar -xzf - -C "$RELEASE/server"

          echo "Copying built React frontend..."

          cp -a client/dist/. "$RELEASE/public/"

          test -f "$RELEASE/server/index.js"
          test -f "$RELEASE/server/package.json"
          test -f "$RELEASE/server/package-lock.json"
          test -f "$RELEASE/public/index.html"

          echo "Production package verified."

      - name: Publish production package to deployment branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          RELEASE="$RUNNER_TEMP/release"

          cd "$RELEASE"

          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A

          git commit -m "Production deployment package"

          git branch -M production-build

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin production-build

          echo "Production package published."

  # JOB 2: DEPLOY TO CPANEL
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Connect to cPanel and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          timeout: 120s
          command_timeout: 30m

          script: |
            set -Ee

            trap 'status=$?; echo "DEPLOYMENT FAILED at line $LINENO (exit code $status)"; exit "$status"' ERR

            APP="/home/fbretcba/report"
            NODE="/home/fbretcba/nodevenv/report/20/bin"

            STAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP="/home/fbretcba/deployment-backups/$STAMP"
            STAGING="/home/fbretcba/deployment-staging-$STAMP"
            ARCHIVE="/home/fbretcba/deployment-source-$STAMP.tar.gz"

            echo "======================================"
            echo "MINISTRY REPORTING SYSTEM"
            echo "GITHUB BUILD DEPLOYMENT"
            echo "======================================"

            # STEP 1: CHECK ENVIRONMENT

            echo "[1/8] Checking cPanel environment..."

            for tool in curl tar cp mkdir touch date rm; do
              command -v "$tool"
            done

            test -x "$NODE/node"
            test -x "$NODE/npm"

            "$NODE/node" --version
            "$NODE/npm" --version

            test -d "$APP"
            test -d "$APP/uploads"
            test -d "$APP/tmp"

            echo "cPanel environment verified."

            # STEP 2: BACKUP LIVE APPLICATION

            echo "[2/8] Backing up production application..."

            mkdir -p "$BACKUP"
            mkdir -p "$STAGING"

            tar -czf "$BACKUP/application-source.tar.gz" \
              --exclude='./.env*' \
              --exclude='./uploads' \
              --exclude='./node_modules' \
              --exclude='./public' \
              --exclude='./tmp' \
              --exclude='./.git' \
              --exclude='./pre-deployment-backup' \
              -C "$APP" .

            if [ -d "$APP/public" ]; then
              tar -czf "$BACKUP/public-files.tar.gz" \
                -C "$APP" public
            fi

            echo "Backup completed: $BACKUP"

            # STEP 3: DOWNLOAD GITHUB BUILD

            echo "[3/8] Downloading production package..."

            curl -fL \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 300 \
              "https://codeload.github.com/TuyFred/ministry-report_system/tar.gz/refs/heads/production-build" \
              -o "$ARCHIVE"

            test -s "$ARCHIVE"

            mkdir -p "$STAGING/source"

            tar -xzf "$ARCHIVE" \
              --strip-components=1 \
              -C "$STAGING/source"

            REPO="$STAGING/source"

            test -f "$REPO/server/index.js"
            test -f "$REPO/server/package.json"
            test -f "$REPO/server/package-lock.json"
            test -f "$REPO/public/index.html"

            echo "GitHub production package verified."

            # STEP 4: INSTALL BACKEND DEPENDENCIES

            echo "[4/8] Installing backend dependencies..."

            cd "$REPO/server"

            "$NODE/npm" ci \
              --omit=dev \
              --no-audit \
              --no-fund

            test -d node_modules

            echo "Backend dependencies installed."

            # STEP 5: PUBLISH BACKEND SOURCE

            echo "[5/8] Publishing backend..."

            tar -czf "$STAGING/backend.tar.gz" \
              --exclude='./.env*' \
              --exclude='./uploads' \
              --exclude='./node_modules' \
              --exclude='./tmp' \
              -C "$REPO/server" .

            tar -xzf "$STAGING/backend.tar.gz" \
              -C "$APP"

            echo "Publishing backend dependencies..."

            mkdir -p "$APP/node_modules"

            cp -a "$REPO/server/node_modules/." \
              "$APP/node_modules/"

            # STEP 6: PUBLISH FRONTEND

            echo "[6/8] Publishing React frontend..."

            mkdir -p "$APP/public"

            rm -rf "$APP/public"

            mkdir -p "$APP/public"

            cp -a "$REPO/public/." "$APP/public/"

            test -f "$APP/public/index.html"

            echo "Frontend published successfully."

            # STEP 7: VERIFY PRODUCTION FILES

            echo "[7/8] Verifying production application..."

            test -f "$APP/index.js"
            test -f "$APP/package.json"
            test -f "$APP/public/index.html"
            test -d "$APP/node_modules"
            test -d "$APP/uploads"

            echo "Production files verified."

            # STEP 8: RESTART PASSENGER

            echo "[8/8] Restarting Node.js application..."

            touch "$APP/tmp/restart.txt"

            echo "Passenger restart requested."

            # REMOVE TEMPORARY DEPLOYMENT FILES

            rm -rf "$STAGING"
            rm -f "$ARCHIVE"

            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL!"
            echo "======================================"

            echo "Website: https://report.gnitafrica.com"
            echo "Backup: $BACKUP"
