# STEP 6: INSTALL VITE AND BUILD FRONTEND

echo "[6/9] Preparing React frontend..."

cd "$REPO/client"

echo "Checking frontend directory..."
pwd
test -f package.json

echo "Installing frontend dependencies..."
"$NODE/npm" install \
  --include=dev \
  --include=optional \
  --no-audit \
  --no-fund

echo "Checking Vite installation..."
"$NODE/npm" ls vite

echo "Verifying Vite executable..."
test -f node_modules/vite/bin/vite.js

echo "Checking Vite version..."
"$NODE/node" node_modules/vite/bin/vite.js --version

echo "Building React frontend..."
"$NODE/npm" run build

test -f "$REPO/client/dist/index.html"

echo "FRONTEND BUILD SUCCESSFUL."
