
name: Deploy Ministry Reporting System to cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy through SSH
    runs-on: ubuntu-latest

    steps:
      - name: Connect to cPanel and deploy from GitHub
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          timeout: 120s
          command_timeout: 30m

          script: |
            set -e

            APP="/home/fbretcba/report"
            NODE="/home/fbretcba/nodevenv/report/20/bin"
            STAGING="/home/fbretcba/deployment-staging"
            ARCHIVE="/home/fbretcba/deployment-source.tar.gz"

            echo "=================================="
            echo "STARTING DEPLOYMENT"
            echo "=================================="

            # Check required programs
            command -v curl
            command -v tar
            command -v rsync

            test -x "$NODE/node"
            test -x "$NODE/npm"

            # Check the production application
            test -d "$APP"
            test -d "$APP/uploads"
            test -d "$APP/tmp"

            # Download source directly from GitHub
            echo "Downloading GitHub source..."

            rm -rf "$STAGING"
            mkdir -p "$STAGING/source"

            curl -fL \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 300 \
              "https://codeload.github.com/TuyFred/ministry-report_system/tar.gz/refs/heads/main" \
              -o "$ARCHIVE"

            echo "Extracting source..."

            tar -xzf "$ARCHIVE" \
              --strip-components=1 \
              -C "$STAGING/source"

            REPO="$STAGING/source"

            # Verify project files
            test -f "$REPO/server/index.js"
            test -f "$REPO/server/package.json"
            test -f "$REPO/server/package-lock.json"
            test -f "$REPO/client/package.json"

            # Build React frontend
            echo "Building React frontend..."

            cd "$REPO/client"

            "$NODE/npm" install --no-audit --no-fund
            "$NODE/npm" run build

            test -f "$REPO/client/dist/index.html"

            # Install backend dependencies in staging
            echo "Installing backend dependencies..."

            cd "$REPO/server"

            "$NODE/npm" ci --omit=dev --no-audit --no-fund

            # Prepare frontend in staging
            mkdir -p "$STAGING/new-public"
            cp -a "$REPO/client/dist/." "$STAGING/new-public/"

            # Preserve existing production configuration and uploads
            echo "Publishing backend files..."

            rsync -a \
              --exclude='.env*' \
              --exclude='uploads/' \
              --exclude='node_modules/' \
              --exclude='public/' \
              --exclude='tmp/' \
              --exclude='pre-deployment-backup/' \
              "$REPO/server/" "$APP/"

            # Publish installed backend dependencies
            rsync -a "$REPO/server/node_modules/" "$APP/node_modules/"

            # Publish frontend files without deleting existing files
            mkdir -p "$APP/public"

            rsync -a "$STAGING/new-public/" "$APP/public/"

            # Verify production files
            test -f "$APP/index.js"
            test -f "$APP/package.json"
            test -f "$APP/public/index.html"
            test -d "$APP/uploads"

            # Verify configured upload directory exists
            test -d "/home/fbretcba/report/uploads"

            # Restart Passenger
            echo "Restarting Node.js application..."

            touch "$APP/tmp/restart.txt"

            # Cleanup temporary deployment files
            rm -rf "$STAGING"
            rm -f "$ARCHIVE"

            echo "=================================="
            echo "DEPLOYMENT COMPLETED"
            echo "=================================="
