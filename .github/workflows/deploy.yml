
name: Deploy Ministry Reporting System to cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Download and deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          timeout: 120s
          command_timeout: 30m

          script: |
            set -Ee

            trap 'echo "DEPLOYMENT FAILED at line $LINENO"' ERR

            APP="/home/fbretcba/report"
            NODE="/home/fbretcba/nodevenv/report/20/bin"
            STAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP="/home/fbretcba/deployment-backups/$STAMP"
            STAGING="/home/fbretcba/deployment-staging-$STAMP"
            ARCHIVE="/home/fbretcba/deployment-source-$STAMP.tar.gz"

            echo "=================================="
            echo "STARTING DEPLOYMENT"
            echo "=================================="

            # Check required tools
            echo "Checking deployment tools..."

            command -v curl
            command -v tar
            command -v cp

            test -x "$NODE/node"
            test -x "$NODE/npm"

            echo "Node:"
            "$NODE/node" --version

            echo "NPM:"
            "$NODE/npm" --version

            # Check live application folders
            echo "Checking production folders..."

            test -d "$APP"
            test -d "$APP/uploads"
            test -d "$APP/tmp"

            echo "Production folders are available."

            # Create backup
            echo "Creating production backup..."

            mkdir -p "$BACKUP"
            mkdir -p "$STAGING/source"

            tar -czf "$BACKUP/application-source.tar.gz" \
              --exclude='./.env*' \
              --exclude='./uploads' \
              --exclude='./node_modules' \
              --exclude='./public' \
              --exclude='./tmp' \
              --exclude='./pre-deployment-backup' \
              -C "$APP" .

            if [ -d "$APP/public" ]; then
              tar -czf "$BACKUP/public-files.tar.gz" \
                -C "$APP" public
            fi

            echo "Backup completed: $BACKUP"

            # Download GitHub source
            echo "Downloading GitHub repository..."

            curl -fL \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 300 \
              "https://codeload.github.com/TuyFred/ministry-report_system/tar.gz/refs/heads/main" \
              -o "$ARCHIVE"

            echo "GitHub download completed."

            # Extract source
            echo "Extracting repository..."

            tar -xzf "$ARCHIVE" \
              --strip-components=1 \
              -C "$STAGING/source"

            REPO="$STAGING/source"

            # Verify project files
            test -f "$REPO/server/index.js"
            test -f "$REPO/server/package.json"
            test -f "$REPO/server/package-lock.json"
            test -f "$REPO/client/package.json"

            echo "Project files verified."

            # Build React frontend
            echo "Building React frontend..."

            cd "$REPO/client"

            "$NODE/npm" install --include=dev --no-audit --no-fund
            "$NODE/npm" run build

            test -f "$REPO/client/dist/index.html"

            echo "Frontend build completed."

            # Install backend production dependencies
            echo "Installing backend dependencies..."

            cd "$REPO/server"

            "$NODE/npm" ci --omit=dev --no-audit --no-fund

            test -d "$REPO/server/node_modules"

            echo "Backend dependencies installed."

            # Prepare backend archive without production data
            echo "Preparing backend files..."

            tar -czf "$STAGING/server-source.tar.gz" \
              --exclude='./.env*' \
              --exclude='./uploads' \
              --exclude='./node_modules' \
              --exclude='./public' \
              --exclude='./tmp' \
              --exclude='./pre-deployment-backup' \
              -C "$REPO/server" .

            # Publish backend source
            echo "Publishing backend source..."

            tar -xzf "$STAGING/server-source.tar.gz" \
              -C "$APP"

            # Publish backend dependencies
            echo "Publishing backend dependencies..."

            mkdir -p "$APP/node_modules"

            cp -a "$REPO/server/node_modules/." \
              "$APP/node_modules/"

            # Publish frontend
            echo "Publishing React frontend..."

            mkdir -p "$APP/public"

            cp -a "$REPO/client/dist/." \
              "$APP/public/"

            # Verify production files
            echo "Verifying deployed files..."

            test -f "$APP/index.js"
            test -f "$APP/package.json"
            test -f "$APP/public/index.html"
            test -d "$APP/uploads"
            test -d "$APP/node_modules"

            echo "Application files verified."

            # Restart Passenger
            echo "Restarting Node.js application..."

            touch "$APP/tmp/restart.txt"

            # Remove temporary files
            rm -rf "$STAGING"
            rm -f "$ARCHIVE"

            echo "=================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=================================="
            echo "Backup location: $BACKUP"
            echo "Live application: $APP"
