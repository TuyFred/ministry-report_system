
name: Deploy Ministry Reporting System to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Build React frontend
      - name: Install frontend dependencies and build
        run: |
          cd client
          npm install --no-audit --no-fund
          npm run build

      # Step 4: Prepare backend and frontend files
      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package/backend/public

          rsync -a \
            --exclude='.env*' \
            --exclude='node_modules/' \
            --exclude='uploads/' \
            --exclude='public/' \
            --exclude='pre-deployment-backup/' \
            --exclude='.git/' \
            server/ deploy-package/backend/

          cp -a client/dist/. deploy-package/backend/public/

          tar -czf deployment.tar.gz -C deploy-package .

          echo "Deployment package prepared."

      # Step 5: Upload files to cPanel
      - name: Upload package to cPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          source: deployment.tar.gz
          target: /home/fbretcba/deploy-staging
          timeout: 120s
          command_timeout: 10m
          overwrite: true
          debug: true

      # Step 6: Publish application on cPanel
      - name: Deploy backend and frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e

            APP=/home/fbretcba/report
            STAGING=/home/fbretcba/deploy-staging
            NODE_ENV_DIR=/home/fbretcba/nodevenv/report/20

            echo "Checking deployment files..."

            test -f "$STAGING/deployment.tar.gz"

            mkdir -p "$STAGING/extracted"
            mkdir -p "$APP/public"
            mkdir -p "$APP/tmp"
            mkdir -p "$APP/uploads"

            tar -xzf "$STAGING/deployment.tar.gz" \
              -C "$STAGING/extracted"

            test -f "$STAGING/extracted/backend/index.js"
            test -f "$STAGING/extracted/backend/package.json"
            test -f "$STAGING/extracted/backend/package-lock.json"
            test -f "$STAGING/extracted/backend/public/index.html"

            echo "Publishing application files..."

            cp -a "$STAGING/extracted/backend/." "$APP/"

            export PATH="$NODE_ENV_DIR/bin:$PATH"

            cd "$APP"

            echo "Installing production dependencies..."

            npm ci --omit=dev --no-audit --no-fund

            echo "Restarting Node.js application..."

            touch "$APP/tmp/restart.txt"

            echo "Cleaning temporary deployment files..."

            rm -rf "$STAGING"

            echo "Deployment completed successfully."
