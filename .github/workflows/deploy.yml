
name: Check cPanel Deployment Tools

on:
  workflow_dispatch:

jobs:
  check-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Check cPanel and GitHub connection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          timeout: 60s
          command_timeout: 180s

          script: |
            set -e

            echo "===== 1. CPANEL SSH CONNECTION ====="
            whoami
            pwd

            echo ""
            echo "===== 2. CHECK DEPLOYMENT TOOLS ====="

            for tool in curl tar rsync npm node cp; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "$tool: AVAILABLE"
              else
                echo "$tool: NOT AVAILABLE"
              fi
            done

            echo ""
            echo "===== 3. CHECK NODE VERSION ====="

            /home/fbretcba/nodevenv/report/20/bin/node --version
            /home/fbretcba/nodevenv/report/20/bin/npm --version

            echo ""
            echo "===== 4. CHECK CPANEL FOLDERS ====="

            ls -ld /home/fbretcba/report
            ls -ld /home/fbretcba/report/public
            ls -ld /home/fbretcba/report/uploads
            ls -ld /home/fbretcba/report/tmp

            echo ""
            echo "===== 5. TEST GITHUB DOWNLOAD ====="

            curl -fL \
              --connect-timeout 30 \
              --max-time 120 \
              "https://codeload.github.com/TuyFred/ministry-report_system/tar.gz/refs/heads/main" \
              -o /home/fbretcba/github-test.tar.gz

            echo "GitHub download successful"

            ls -lh /home/fbretcba/github-test.tar.gz

            echo ""
            echo "===== 6. TEST ARCHIVE ====="

            tar -tzf /home/fbretcba/github-test.tar.gz | head -20

            rm -f /home/fbretcba/github-test.tar.gz

            echo ""
            echo "===== ALL CHECKS COMPLETED ====="
