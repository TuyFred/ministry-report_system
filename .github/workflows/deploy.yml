
name: Ministry Reporting System - Build and cPanel Deployment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ministry-report-production
  cancel-in-progress: false

jobs:
  build:
    name: Build React and prepare release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check frontend files
        run: |
          set -e
          test -f client/package.json
          test -f client/package-lock.json
          echo "Frontend package files found."

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build React frontend
        working-directory: client
        run: |
          set -e
          npm run build
          test -f dist/index.html

          if [ -f .htaccess ]; then
            cp .htaccess dist/.htaccess
          fi

          echo "React build completed."

      - name: Prepare production package
        run: |
          set -e

          RELEASE="$RUNNER_TEMP/release"
          mkdir -p "$RELEASE/server" "$RELEASE/public"

          tar -czf - \
            --exclude='./.env*' \
            --exclude='./uploads' \
            --exclude='./node_modules' \
            --exclude='./tmp' \
            --exclude='./.git' \
            --exclude='./.htaccess' \
            -C server . | tar -xzf - -C "$RELEASE/server"

          cp -a client/dist/. "$RELEASE/public/"

          test -f "$RELEASE/server/index.js"
          test -f "$RELEASE/server/package.json"
          test -f "$RELEASE/server/package-lock.json"
          test -f "$RELEASE/public/index.html"

          echo "Production package prepared."

      - name: Publish production package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          cd "$RUNNER_TEMP/release"

          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Production deployment package"
          git branch -M production-build

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin production-build

  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT }}
          timeout: 120s
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            APP="/home/fbretcba/report"
            NODE="/home/fbretcba/nodevenv/report/20/bin"

            STAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP="/home/fbretcba/deployment-backups/$STAMP"
            STAGING="/home/fbretcba/deployment-staging-$STAMP"
            ARCHIVE="/home/fbretcba/deployment-source-$STAMP.tar.gz"

            BACKEND_PUBLISHED=0
            PUBLIC_SWAPPED=0

            rollback() {
              STATUS=$?
              set +e

              echo "DEPLOYMENT FAILED. Attempting rollback..."

              if [ "$BACKEND_PUBLISHED" = "1" ] &&
                 [ -s "$BACKUP/application-source.tar.gz" ]; then
                echo "Restoring previous backend source..."
                tar -xzf "$BACKUP/application-source.tar.gz" -C "$APP"
              fi

              if [ "$PUBLIC_SWAPPED" = "1" ] &&
                 [ -d "$STAGING/previous-public" ]; then
                echo "Restoring previous frontend..."
                rm -rf "$APP/public"
                mv "$STAGING/previous-public" "$APP/public"
              fi

              echo "Backup location: $BACKUP"
              echo "Rollback attempt finished. Exit code: $STATUS"
              exit "$STATUS"
            }

            trap rollback ERR

            echo "======================================"
            echo "MINISTRY REPORTING SYSTEM DEPLOYMENT"
            echo "======================================"

            # 1. Verify cPanel environment.
            echo "[1/8] Checking environment..."

            for tool in curl tar cp mkdir touch date mv rm; do
              command -v "$tool"
            done

            test -x "$NODE/node"
            test -x "$NODE/npm"
            "$NODE/node" --version
            "$NODE/npm" --version

            test -d "$APP"
            test -f "$APP/.env"
            test -d "$APP/uploads"
            test -d "$APP/tmp"
            test -d "$APP/node_modules"
            test -L "$APP/node_modules"

            echo "cPanel environment verified."

            # 2. Back up live application source.
            echo "[2/8] Backing up current application..."

            mkdir -p "$BACKUP" "$STAGING"

            tar -czf "$BACKUP/application-source.tar.gz" \
              --exclude='./.env*' \
              --exclude='./uploads' \
              --exclude='./node_modules' \
              --exclude='./public' \
              --exclude='./tmp' \
              --exclude='./.git' \
              --exclude='./.htaccess' \
              --exclude='./pre-deployment-backup' \
              -C "$APP" .

            if [ -d "$APP/public" ]; then
              tar -czf "$BACKUP/public-files.tar.gz" \
                -C "$APP" public
            fi

            echo "Backup saved at $BACKUP"

            # 3. Download release.
            echo "[3/8] Downloading release..."

            curl -fL --retry 3 --retry-delay 5 \
              --connect-timeout 30 --max-time 300 \
              "https://codeload.github.com/TuyFred/ministry-report_system/tar.gz/refs/heads/production-build" \
              -o "$ARCHIVE"

            test -s "$ARCHIVE"

            mkdir -p "$STAGING/source"

            tar -xzf "$ARCHIVE" \
              --strip-components=1 \
              -C "$STAGING/source"

            REPO="$STAGING/source"

            test -f "$REPO/server/index.js"
            test -f "$REPO/server/package.json"
            test -f "$REPO/server/package-lock.json"
            test -f "$REPO/public/index.html"

            # 4. Prepare frontend and backend files.
            echo "[4/8] Preparing deployment files..."

            mkdir -p "$STAGING/new-public"
            cp -a "$REPO/public/." "$STAGING/new-public/"

            if [ -f "$APP/public/.htaccess" ] &&
               [ ! -f "$STAGING/new-public/.htaccess" ]; then
              cp "$APP/public/.htaccess" "$STAGING/new-public/.htaccess"
            fi

            tar -czf "$STAGING/backend.tar.gz" \
              --exclude='./.env*' \
              --exclude='./uploads' \
              --exclude='./node_modules' \
              --exclude='./tmp' \
              --exclude='./.git' \
              --exclude='./.htaccess' \
              -C "$REPO/server" .

            test -s "$STAGING/backend.tar.gz"
            test -f "$STAGING/new-public/index.html"

            # 5. Publish backend source and dependencies.
            echo "[5/8] Publishing backend..."

            BACKEND_PUBLISHED=1

            tar -xzf "$STAGING/backend.tar.gz" -C "$APP"

            test -L "$APP/node_modules"

            cd "$APP"

            "$NODE/npm" install \
              --omit=dev \
              --no-audit \
              --no-fund

            test -d "$APP/node_modules"

            "$NODE/node" -e \
              "require('express'); require('sequelize'); console.log('Backend dependencies verified')"

            # 6. Replace frontend.
            echo "[6/8] Publishing frontend..."

            if [ -d "$APP/public" ]; then
              mv "$APP/public" "$STAGING/previous-public"
            fi

            PUBLIC_SWAPPED=1
            mv "$STAGING/new-public" "$APP/public"

            test -f "$APP/public/index.html"

            # 7. Verify deployment files.
            echo "[7/8] Verifying deployment..."

            test -f "$APP/index.js"
            test -f "$APP/package.json"
            test -f "$APP/public/index.html"
            test -f "$APP/.env"
            test -d "$APP/uploads"
            test -d "$APP/tmp"
            test -L "$APP/node_modules"

            echo "Production files verified."

            # 8. Restart Passenger.
            echo "[8/8] Restarting Node.js application..."

            touch "$APP/tmp/restart.txt"

            echo "Passenger restart requested."

            rm -rf "$STAGING"
            rm -f "$ARCHIVE"

            trap - ERR

            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "Website: https://report.gnitafrica.com"
            echo "Backup: $BACKUP"
            echo "======================================"
